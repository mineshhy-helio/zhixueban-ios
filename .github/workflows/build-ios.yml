name: Build & Distribute iOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-*'

env:
  APP_NAME: ZhiXueBan
  SCHEME: ZhiXueBan
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for v in 16.4 16.3 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_${v}.app"
              echo "Using Xcode $v"
              exit 0
            fi
          done
          echo "No Xcode 16 found, using default"
          ls -d /Applications/Xcode*.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ZhiXueBan
        run: xcodegen generate

      - name: DIAG1 project structure
        working-directory: ZhiXueBan
        run: |
          echo "=== appiconset files on disk ==="
          ls -1 Assets.xcassets/AppIcon.appiconset/ 2>&1 | head -30
          echo "=== pbxproj asset references ==="
          grep -n -iE "xcassets|assetcatalog|actool|AppIcon|\.car" ZhiXueBan.xcodeproj/project.pbxproj 2>&1 | head -60
          echo "=== PBXResourcesBuildPhase ==="
          awk '/Begin PBXResourcesBuildPhase/,/End PBXResourcesBuildPhase/' ZhiXueBan.xcodeproj/project.pbxproj 2>&1 | head -40

      - name: Force Info.plist keys (xcodegen drops complex keys)
        working-directory: ZhiXueBan
        run: |
          PLIST="ZhiXueBan/Info.plist"
          echo "=== Info.plist path: $PLIST ==="
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 14.0" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 14.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:BackgroundColor dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:BackgroundColor:Red real 1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:BackgroundColor:Green real 1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:BackgroundColor:Blue real 1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:BackgroundColor:Alpha real 1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:2 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationPortraitUpsideDown" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:2 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:3 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          echo "=== Final Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -E "CFBundleIconName|MinimumOSVersion|UILaunchScreen|UISupportedInterface" | head -20

      # 签名材料：把 p12 证书和描述文件用 base64 存成 GitHub Secrets
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PWD: ${{ secrets.IOS_CERT_PASSWORD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          SECURITY_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PWD" "$SECURITY_PATH"
          security set-keychain-settings -lut 21600 "$SECURITY_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$SECURITY_PATH"
          printf '%s' "$CERT_P12" | base64 -D > "$RUNNER_TEMP/cert.p12"
          echo "p12 size: $(wc -c < "$RUNNER_TEMP/cert.p12") bytes"
          security import "$RUNNER_TEMP/cert.p12" -k "$SECURITY_PATH" -P "$CERT_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$SECURITY_PATH"
          security list-keychains -d user -s "$SECURITY_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_NAME.mobileprovision"

      - name: Build archive
        working-directory: ZhiXueBan
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          xcodebuild -project ZhiXueBan.xcodeproj -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/ZhiXueBan.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE" \
            INFOPLIST_FILE="ZhiXueBan/Info.plist" \
            GENERATE_INFOPLIST_FILE=NO \
            clean archive

      - name: Patch archived app (icons + Info.plist)
        run: |
          APP="$RUNNER_TEMP/ZhiXueBan.xcarchive/Products/Applications/ZhiXueBan.app"
          echo "APP=$APP"
          ls -la "$APP" | head
          PLIST="$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 14.0" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:BackgroundColor dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:BackgroundColor:Red real 1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:BackgroundColor:Green real 1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:BackgroundColor:Blue real 1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:BackgroundColor:Alpha real 1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:2 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationPortraitUpsideDown" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:2 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:3 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          for sz in 120 152 76 167 180 60 40 80 58 87 29 20; do
            if [ -f "ZhiXueBan/Assets.xcassets/AppIcon.appiconset/icon-$sz.png" ]; then
              cp "ZhiXueBan/Assets.xcassets/AppIcon.appiconset/icon-$sz.png" "$APP/"
            fi
          done
          echo "=== Patched Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -E "CFBundleIconName|UILaunchScreen|MinimumOSVersion" | head

      - name: Export IPA
        working-directory: ZhiXueBan
        env:
          EXPORT_PLIST: ${{ secrets.IOS_EXPORT_PLIST_BASE64 }}
        run: |
          echo "$EXPORT_PLIST" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ZhiXueBan.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: DIAG2 exported IPA
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" -type f | head -1)
          echo "IPA=$IPA"
          echo "=== files in IPA ==="
          unzip -l "$IPA" | grep -iE "Info.plist|\.car|\.png|Assets" | head -40
          echo "=== Info.plist keys in IPA ==="
          unzip -p "$IPA" Payload/ZhiXueBan.app/Info.plist > /tmp/ipa_info.plist
          plutil -p /tmp/ipa_info.plist | grep -iE "Icon|Launch|Orient|MinimumOS|CFBundleIcons" | head -40

      - name: Upload to App Store Connect
        env:
          API_KEY: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" -type f | head -1)
          echo "IPA path: $IPA"
          xcrun altool --upload-app -f "$IPA" \
            -t ios --apiKey "$API_KEY_ID" --apiIssuer "$ISSUER_ID" --verbose

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZhiXueBan-IPA
          path: ${{ runner.temp }}/export/*.ipa
