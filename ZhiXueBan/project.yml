name: ZhiXueBan
options:
  bundleIdPrefix: com.zhixueban
  deploymentTarget:
    iOS: "13.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.zhixueban.app
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: ZhiXueBan/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    IPHONEOS_DEPLOYMENT_TARGET: "13.0"
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "iPhone Developer"
      PROVISIONING_PROFILE_SPECIFIER: "$(IOS_PROVISIONING_PROFILE)"
    Release:
      CODE_SIGN_IDENTITY: "iPhone Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "$(IOS_PROVISIONING_PROFILE)"

targets:
  ZhiXueBan:
    type: application
    platform: iOS
    sources:
      - ZhiXueBan
    settings:
      base:
        PRODUCT_NAME: 智学伴
        PRODUCT_BUNDLE_IDENTIFIER: com.zhixueban.app
    info:
      path: ZhiXueBan/Info.plist
      properties:
        CFBundleDisplayName: 智学伴
        UILaunchStoryboardName: LaunchScreen
